# 커밋되는 공통 설정 — 비밀값(DB 비밀번호·키)은 application.yml(커밋 금지)이나 환경변수에.
# 같은 위치의 application.yml보다 이 파일이 우선함.

# 스키마는 Flyway(db/migration/V*.sql)가 단일 소스. Hibernate는 엔티티와 DB가 맞는지 검사만 — 안 맞으면 기동 실패
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 테이블이 있는 기존 DB는 V1(baseline)을 건너뛰고 '적용됨'으로 표시만
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# 적용된 마이그레이션 파일을 고치면 기동 실패(checksum) — 운영 DB에서 clean 금지
spring.flyway.clean-disabled=true
